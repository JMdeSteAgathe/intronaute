[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "intronaute"
version = "1.0.0"
description = "Minor-intron (U12) retention detection from RNA-seq BAM cohorts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["rna-seq", "splicing", "minor spliceosome", "U12", "intron retention"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.23", "pandas>=1.5", "scipy>=1.9", "matplotlib>=3.5", "odfpy>=1.4",
]

[project.optional-dependencies]
csi = ["bamnostic>=1.3"]
fast = ["pysam>=0.21; platform_system != 'Windows'"]

[project.scripts]
intronaute = "intronaute.cli:main"

[tool.setuptools]
packages = ["intronaute"]
